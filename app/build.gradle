plugins {
    id 'com.android.application'
}

android {
    namespace "com.thunderboarsolution.MVVMretrofiltrequest"
    compileSdk 34

    defaultConfig {
        applicationId "com.thunderboarsolution.MVVMretrofiltrequest"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Expose Gemini API key from gradle.properties as BuildConfig.GEMINI_API_KEY (do not hardcode in code)
        buildConfigField "String", "GEMINI_API_KEY", "\"${GEMINI_API_KEY}\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Use Java 17 to match AGP 8.x requirements and remove deprecation warnings
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Enable BuildConfig so BuildConfig.GEMINI_API_KEY is generated
    buildFeatures {
        buildConfig true
    }
}

dependencies {
 
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // Added for Study Tracker features
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Chatbot: HTTP + JSON for Gemini calls
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
}